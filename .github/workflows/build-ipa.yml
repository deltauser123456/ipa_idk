name: Build Chat IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "Missing GOOGLE_SERVICE_INFO_PLIST repository secret."
            exit 1
          fi
          mkdir -p Calculator
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > Calculator/GoogleService-Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Chat.xcodeproj \
            -scheme Chat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Chat.app Payload/
          /usr/bin/zip -r Chat.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chat-unsigned-IPA
          path: Chat.ipa
          if-no-files-found: error
